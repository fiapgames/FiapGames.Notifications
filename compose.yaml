services:
  rabbitmq:
    image: rabbitmq:3-management
    container_name: fiapgames-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: fiapgames-admin
      RABBITMQ_DEFAULT_PASS: FiapGames@Admin123
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq

  postgres:
    image: postgres:16
    container_name: fiapgames-notifications-postgres
    environment:
      POSTGRES_USER: fiapgames-admin
      POSTGRES_PASSWORD: FiapGames@Admin123
      POSTGRES_DB: fiapgames-notifications
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fiapgames-admin -d fiapgames-notifications"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - postgres-data:/var/lib/postgresql/data

  mailhog:
    image: mailhog/mailhog:latest
    container_name: fiapgames-mailhog
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # Web UI

  notifications-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fiapgames-notifications
    depends_on:
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_healthy
      mailhog:
        condition: service_started
    ports:
      - "8081:8080"
    environment:
      ConnectionStrings__Postgres: "Host=postgres;Port=5432;Database=fiapgames-notifications;Username=fiapgames-admin;Password=FiapGames@Admin123"
      RabbitMq__Host: rabbitmq
      RabbitMq__VirtualHost: "/"
      RabbitMq__UserName: fiapgames-admin
      RabbitMq__Password: FiapGames@Admin123
      Smtp__Host: mailhog
      Smtp__Port: 1025
      Smtp__From: noreply@fiapgames.local

volumes:
  rabbitmq-data:
  postgres-data:
